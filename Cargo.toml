[package]
name = "unei"
version = "0.1.0"
edition = "2024"
description = "unei - bespoke, zero-config, vim-like editor"
license = "MIT"

[dependencies]
anyhow = "1"
ignore = "0.4"
nucleo-matcher = "0.3"
ropey = "1.6"
ratatui = "0.29"
unicode-segmentation = "1"
unicode-width = "0.2"
tree-sitter = "0.27.0"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24.2"
tree-sitter-md = "0.5.3"
tree-sitter-toml-ng = "0.7.0"
streaming-iterator = "0.1.9"
tree-sitter-yaml = "0.7.2"
tree-sitter-json = "0.24.8"
tree-sitter-javascript = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-bash = "0.25.1"
tree-sitter-nix = "0.3.0"
tree-sitter-python = "0.25.0"
tree-sitter-css = "0.25.0"
serde_json = "1.0.151"
regex = "1.13.1"

[target.'cfg(unix)'.dependencies]
# killpg: a timed-out formatter takes its spawned children with it (#82)
libc = "0.2"

[build-dependencies]
cc = "1"

[[bin]]
name = "unei"
path = "src/main.rs"

[lib]
name = "unei"
path = "src/lib.rs"
